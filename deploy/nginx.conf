# Het Geheim van de Duinkapel — plain-HTTP static site for the home LAN.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/duinkapel
#          sudo ln -sf /etc/nginx/sites-available/duinkapel /etc/nginx/sites-enabled/duinkapel
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/duinkapel;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Older mime.types files lack .wasm; the game falls back if this is
    # wrong, but the right type lets browsers compile while downloading.
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # Revalidate code and level packs so updates show up without clearing caches.
    location ~ \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/wasm application/json application/javascript text/css image/svg+xml;
}
