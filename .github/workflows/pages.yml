# Test, validate the level packs, build the WASM and publish web/ to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace --release
      - name: Validate level packs (every level unique and reproducible)
        run: cargo run --release -p levelpack -- validate web/levels
      - name: Install wasm-pack
        run: curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build WASM
        run: |
          wasm-pack build core --target web --release --out-dir ../web/pkg
          rm -f web/pkg/.gitignore web/pkg/package.json web/pkg/*.d.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
